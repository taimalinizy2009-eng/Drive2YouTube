name: Build Drive2YouTube APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project
        run: |
          unzip -o Drive2YouTube-GitHub-Starter.zip -d project

      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.7"
          arguments: -p project assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Drive2YouTube-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
